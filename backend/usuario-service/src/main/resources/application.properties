spring.application.name=usuario-service
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/sonidovivo_usuarios?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


logging.file.name=logs/usuario-service.log

# JWT usado para autenticacion y renovacion de sesion.
seguridad.jwt.secreto=${JWT_SECRET:sonido-vivo-clave-jwt-2026-microservicios-segura-123456789}
seguridad.jwt.expiracion-minutos=30
seguridad.jwt.renovacion-dias=7
