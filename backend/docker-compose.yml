services:
  mysql:
    image: mysql:8.4
    container_name: sonidovivo-mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3307:3306"
    volumes:
      - sonidovivo_mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot"]
      interval: 10s
      timeout: 5s
      retries: 12

  eureka-server:
    build: ./eureka-server
    container_name: sonidovivo-eureka
    ports:
      - "8761:8761"

  usuario-service:
    build: ./usuario-service
    container_name: sonidovivo-usuarios
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sonidovivo_usuarios?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: sonido-vivo-clave-jwt-2026-microservicios-segura-123456789
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  producto-service:
    build: ./producto-service
    container_name: sonidovivo-productos
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sonidovivo_productos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  notificacion-service:
    build: ./notificacion-service
    container_name: sonidovivo-notificaciones
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sonidovivo_notificaciones?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  pedido-service:
    build: ./pedido-service
    container_name: sonidovivo-pedidos
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sonidovivo_pedidos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      usuario-service:
        condition: service_started
      producto-service:
        condition: service_started
      notificacion-service:
        condition: service_started

  api-gateway:
    build: ./api-gateway
    container_name: sonidovivo-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: sonido-vivo-clave-jwt-2026-microservicios-segura-123456789
    depends_on:
      eureka-server:
        condition: service_started
      usuario-service:
        condition: service_started
      producto-service:
        condition: service_started
      pedido-service:
        condition: service_started
      notificacion-service:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: http://localhost:8080
    container_name: sonidovivo-frontend
    ports:
      - "5173:80"
    depends_on:
      api-gateway:
        condition: service_started

volumes:
  sonidovivo_mysql_data:
